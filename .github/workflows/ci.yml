name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.11"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install application and development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate repository
        run: python scripts/check_project.py
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
      - name: Build package
        run: python -m build
      - name: Smoke-test Streamlit
        run: python scripts/smoke_app.py

  container:
    name: Docker build
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
      - name: Build runtime image
        run: docker build --tag pcb-visual-inspector:ci .
