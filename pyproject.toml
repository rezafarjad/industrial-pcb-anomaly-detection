[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "industrial-pcb-anomaly-detection"
version = "1.0.0"
description = "Reference-based visual anomaly localization for printed circuit boards"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "rezafarjad" }]
keywords = [
  "anomaly-detection",
  "computer-vision",
  "industrial-inspection",
  "pcb",
  "quality-control",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Intended Audience :: Manufacturing",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10,<5",
  "Pillow>=10,<13",
  "streamlit>=1.40,<1.50",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<9",
  "ruff>=0.9,<1",
  "tomli>=2,<3; python_version < '3.11'",
]
train = [
  "datasets>=3,<5",
  "huggingface_hub>=0.27,<2",
  "joblib>=1.4,<2",
  "jupyterlab>=4,<5",
  "matplotlib>=3.9,<4",
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2",
  "torch>=2.4,<3",
  "torchvision>=0.19,<1",
  "tqdm>=4.66,<5",
]

[project.scripts]
pcb-inspect = "pcb_anomaly.cli:main"

[project.urls]
Homepage = "https://github.com/rezafarjad/industrial-pcb-anomaly-detection"
Issues = "https://github.com/rezafarjad/industrial-pcb-anomaly-detection/issues"
Repository = "https://github.com/rezafarjad/industrial-pcb-anomaly-detection"

[tool.setuptools.packages.find]
include = ["pcb_anomaly*"]

[tool.ruff]
line-length = 88
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
